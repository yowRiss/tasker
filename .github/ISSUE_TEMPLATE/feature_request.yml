name: ✨ Feature Request
description: Suggest an idea or enhancement for Tasker
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new feature or improvement! Please describe the use case and proposed solution.

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which area would this feature enhance?
      options:
        - Web Frontend (Vue 3)
        - Backend API (Go)
        - Mobile App (Android)
        - Database / Data Model
        - Developer Experience / CI/CD
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem? A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any mockups, diagrams, or additional context about the feature request here.
    validations:
      required: false
