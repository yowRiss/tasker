name: 🐛 Bug Report
description: Report a reproducible bug or defect in Tasker
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible so we can diagnose and fix it quickly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which area of Tasker does this bug affect?
      options:
        - Web Frontend (Vue 3)
        - Backend API (Go)
        - Mobile App (Android)
        - Database / Supabase Migrations
        - Documentation / Tooling
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When clicking on...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Please share your environment details (OS, Browser, Node/Go version, Android version).
      placeholder: |
        - OS: [e.g. Ubuntu 24.04 / macOS Sonoma / Windows 11]
        - Browser: [e.g. Chrome 128, Firefox 130]
        - Go Version: [e.g. 1.26.4]
        - Node Version: [e.g. 22.x]
        - Android Device / OS: [e.g. Pixel 8, Android 14]
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Screenshots
      description: Add any other context, logs, or screenshots about the problem here.
    validations:
      required: false
