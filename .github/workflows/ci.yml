name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Lint Frontend Code
        run: npm --prefix frontend run lint

      - name: Check Code Formatting
        run: npm --prefix frontend run format:check

      - name: Type Check & Build Bundle
        run: npm --prefix frontend run build

  backend-check:
    name: Backend Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l backend/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: go -C backend vet ./...

      - name: Run Backend Tests
        run: go -C backend test -v -race ./...

  android-check:
    name: Android Lint & Check
    runs-on: ubuntu-latest
    # Only run if files in android/ changed, or workflow dispatched
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'mobile') || github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android Code
        run: |
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew :app:lintDebug :app:testDebugUnitTest --no-daemon
